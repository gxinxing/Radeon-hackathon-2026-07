openapi: 3.0.3
info:
  title: Crypto Trading Agent API
  description: >
    API for the crypto trading agent. Provides market data,
    backtesting, and paper trading endpoints.
    Used by Dify as custom API tools.
  version: 1.0.0
  contact:
    name: AMD Hackathon Track 2

servers:
  - url: http://host.docker.internal:8080
    description: Trading API on host (accessible from Dify Docker container)

paths:
  /api/market/summary:
    get:
      operationId: getMarketSummary
      summary: Get current market summary
      description: Fetches real-time price, 24h change, volume for a trading pair
      parameters:
        - name: pair
          in: query
          required: false
          schema:
            type: string
            default: BTC/USDT
          description: Trading pair (e.g. BTC/USDT, ETH/USDT)
        - name: exchange
          in: query
          required: false
          schema:
            type: string
            default: binance
            enum: [binance, okx, bybit, kraken, gate]
      responses:
        '200':
          description: Market summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  pair:
                    type: string
                  last_price:
                    type: number
                  change_pct:
                    type: number
                  high_24h:
                    type: number
                  low_24h:
                    type: number
                  volume_24h:
                    type: number

  /api/market/history:
    get:
      operationId: getHistoricalData
      summary: Get historical OHLCV data
      description: Fetches historical candlestick data for analysis
      parameters:
        - name: pair
          in: query
          required: false
          schema:
            type: string
            default: BTC/USDT
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            default: 1h
            enum: [1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w]
        - name: exchange
          in: query
          required: false
          schema:
            type: string
            default: binance
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
      responses:
        '200':
          description: Historical OHLCV data
          content:
            application/json:
              schema:
                type: object
                properties:
                  pair:
                    type: string
                  timeframe:
                    type: string
                  count:
                    type: integer
                  candles:
                    type: array
                    items:
                      type: object

  /api/backtest:
    post:
      operationId: runBacktest
      summary: Run strategy backtest
      description: >
        Accepts a strategy DSL specification, validates it,
        transpiles to Freqtrade strategy, and runs a historical backtest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                strategy:
                  type: object
                  description: Strategy DSL specification
                days:
                  type: integer
                  default: 180
                initial_balance:
                  type: number
                  default: 10000
      responses:
        '200':
          description: Backtest results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  is_valid:
                    type: boolean
                  strategy_name:
                    type: string
                  metrics:
                    type: object
                  trades:
                    type: array
                  equity_curve:
                    type: array
                    items:
                      type: number
                  error:
                    type: string
                    nullable: true

  /api/indicators/calculate:
    post:
      operationId: calculateIndicators
      summary: Calculate technical indicators
      description: Computes technical indicators (EMA, RSI, MACD, etc.) on provided candle data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                candles:
                  type: array
                  items:
                    type: object
                indicators:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Indicator values
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: object
                  last_values:
                    type: object

  /api/paper-trade/execute:
    post:
      operationId: executePaperTrade
      summary: Execute paper trade on Binance Testnet
      description: Places a simulated buy/sell order on Binance Testnet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [buy, sell, status, balance]
                pair:
                  type: string
                  default: BTC/USDT
                amount:
                  type: number
                  nullable: true
      responses:
        '200':
          description: Trade execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  action:
                    type: string
                  pair:
                    type: string
                  details:
                    type: object
                  error:
                    type: string
                    nullable: true

  /api/agent/run:
    post:
      operationId: runMultiAgent
      summary: Run the full multi-agent pipeline (Retrieval → Reasoning → Risk)
      description: >
        Executes the complete multi-agent trading analysis pipeline in a single
        request. The Retrieval Agent fetches RAG knowledge with confidence
        gating, the Reasoning Agent generates a trading intent (view,
        confidence, position ratio, stop loss), and the Risk Agent validates
        against hard rules with veto power. Returns the full decision chain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: User's natural language trading request
                  example: "BTC放量突破前高，帮我做一个EMA突破策略，止损3%"
                asset:
                  type: string
                  default: BTC-USDT
                  description: Trading asset identifier
                timeframe:
                  type: string
                  default: 1h
                  enum: [15m, 1h, 4h, 1d]
      responses:
        '200':
          description: Multi-agent decision result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  retrieval:
                    type: object
                    description: Retrieval agent output (reference_docs, has_valid_docs)
                    properties:
                      has_valid_docs:
                        type: boolean
                      max_confidence_score:
                        type: number
                      reference_docs:
                        type: array
                        items:
                          type: object
                  reasoning:
                    type: object
                    description: Reasoning agent output (trading intent)
                    properties:
                      view:
                        type: string
                        enum: [long, short, neutral]
                      confidence:
                        type: number
                      suggest_position_ratio:
                        type: number
                      stop_loss_price:
                        type: number
                        nullable: true
                      reason:
                        type: string
                  risk:
                    type: object
                    description: Risk agent output (final decision with veto power)
                    properties:
                      allow_execute:
                        type: boolean
                      final_position_ratio:
                        type: number
                      audit_note:
                        type: string
                      checks_passed:
                        type: array
                        items:
                          type: string
                      checks_failed:
                        type: array
                        items:
                          type: string
                  report:
                    type: string
                    description: Formatted markdown report of the full decision

  /api/agent/reward:
    post:
      operationId: computeReward
      summary: Compute RL reward for a strategy based on backtest metrics
      description: >
        Calculates a normalized reward score [-1, +1] from backtest metrics
        including return, Sharpe, drawdown, alpha, and walk-forward robustness.
        Used by the RL feedback loop for strategy optimization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - metrics
              properties:
                metrics:
                  type: object
                  description: BacktestResult metrics dict
                  properties:
                    total_return:
                      type: number
                    sharpe_ratio:
                      type: number
                    max_drawdown:
                      type: number
                    alpha:
                      type: number
                    sortino_ratio:
                      type: number
                    calmar_ratio:
                      type: number
                    max_consecutive_losses:
                      type: integer
                    win_rate:
                      type: number
                walkforward:
                  type: object
                  nullable: true
                  properties:
                    is_robust:
                      type: boolean
                    overfitting_score:
                      type: number
      responses:
        '200':
          description: Reward computation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reward:
                    type: object
                    properties:
                      total:
                        type: number
                        description: Normalized reward score [-1, +1]
                      grade:
                        type: string
                        enum: [A+, A, B, C, D, F]
                      feedback:
                        type: string
                        description: Natural language feedback
                      components:
                        type: object
                        description: Per-component reward breakdown
